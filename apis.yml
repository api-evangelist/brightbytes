name: BrightBytes
description: >-
  BrightBytes was a San Francisco-based K-12 education data and analytics company founded in 2012
  by Rob Mancabelli, best known for Clarity, a decision-support and analytics platform used by
  schools and districts to connect technology spending and classroom use to student learning
  outcomes, and for DataSense, a data-integration platform that captured, cleaned, and synced
  student data between disparate school systems. The company sold DataSense and its team to
  Microsoft in February 2019 and was itself acquired by Google in 2022. BrightBytes no longer
  operates independently: as of July 2026 www.brightbytes.net returns an expired-site placeholder
  and no developer portal, documentation, API, SDK, or status surface remains. This profile is
  retained as a historical company record with no API surface to catalog.
